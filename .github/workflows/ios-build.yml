name: Build VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Secrets.swift
        run: |
          mkdir -p samples/CameraAccess/CameraAccess

          cat > samples/CameraAccess/CameraAccess/Secrets.swift << 'EOF'
          import Foundation

          enum Secrets {

              // Gemini
              static let apiKey = ""
              static let geminiAPIKey = ""

              // Local OpenClaw
              static let openClawHost = "127.0.0.1"
              static let openClawPort: Int = 8080
              static let openClawHookToken = ""
              static let openClawGatewayToken = ""

              // Cloud Gateway
              static let cloudGatewayURL = ""
              static let cloudGatewayToken = ""
          }
          EOF

      - name: Resolve Swift Packages
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -resolvePackageDependencies

      - name: Build
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Upload Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS
          path: |
            samples/CameraAccess/build
            samples/CameraAccess/**/*.app
            samples/CameraAccess/**/*.ipa
            samples/CameraAccess/**/*.xcarchive
