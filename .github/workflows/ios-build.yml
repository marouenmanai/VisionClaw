name: Build VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Generate Secrets.swift
        run: |
          mkdir -p samples/CameraAccess/CameraAccess

          cat > samples/CameraAccess/CameraAccess/Secrets.swift <<EOF
          import Foundation

          enum Secrets {
              static let apiKey = ""
              static let geminiAPIKey = ""

              static let openClawHost = "127.0.0.1"
              static let openClawPort: Int = 8080
              static let openClawHookToken = ""
              static let openClawGatewayToken = ""

              static let cloudGatewayURL = ""
              static let cloudGatewayToken = ""
          }
          EOF

      - name: Resolve Swift Packages
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -resolvePackageDependencies

      - name: Archive App
        working-directory: samples/CameraAccess
        run: |
          mkdir -p build

          xcodebuild archive \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/CameraAccess.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Show Build Folder
        run: |
          echo "===== BUILD CONTENT ====="
          find samples/CameraAccess/build || true

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-xcarchive
          path: samples/CameraAccess/build/CameraAccess.xcarchive
          if-no-files-found: error
