name: Build VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Xcode Version
        run: xcodebuild -version

      - name: Generate Secrets.swift
        run: |
          cat > samples/CameraAccess/CameraAccess/Secrets.swift <<'EOF'
          import Foundation

          enum Secrets {
              static let geminiAPIKey = ""
              static let openClawHost = ""
              static let openClawPort = 8789
              static let openClawHookToken = ""
              static let openClawGatewayToken = ""
              static let webrtcSignalingURL = ""
          }
          EOF

      - name: Resolve Swift Packages
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project CameraAccess.xcodeproj

      - name: Archive App
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CameraAccess.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        working-directory: samples/CameraAccess
        run: |
          mkdir Payload
          cp -R build/CameraAccess.xcarchive/Products/Applications/CameraAccess.app Payload/
          zip -r CameraAccess.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-IPA
          path: samples/CameraAccess/CameraAccess.ipa

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess-XCArchive
          path: samples/CameraAccess/build/CameraAccess.xcarchive
