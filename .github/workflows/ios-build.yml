name: Build VisionClaw iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Secrets.swift
        run: |
          mkdir -p samples/CameraAccess/CameraAccess
          cat << 'EOF' > samples/CameraAccess/CameraAccess/Secrets.swift
          import Foundation

          enum Secrets {
              static let apiKey = ""
          }
          EOF

      - name: Resolve Swift Packages
        run: |
          cd samples/CameraAccess
          xcodebuild -resolvePackageDependencies -project CameraAccess.xcodeproj

      - name: Build
        run: |
          cd samples/CameraAccess
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: VisionClaw-iOS
          path: samples/CameraAccess/build
