name: Build VisionClaw iOS
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Generate Secrets.swift
        run: |
          mkdir -p samples/CameraAccess/CameraAccess
          cat > samples/CameraAccess/CameraAccess/Secrets.swift <<EOF
          import Foundation
          enum Secrets {
              // Gemini
              static let geminiAPIKey = "${{ secrets.GEMINI_API_KEY }}"
              // Cloud Gateway
              static let cloudGatewayURL = ""
              static let cloudGatewayToken = ""
              // WebRTC
              static let webrtcSignalingURL = ""
              // OpenClaw
              static let openClawHost = "127.0.0.1"
              static let openClawPort = 8080
              static let openClawHookToken = ""
              static let openClawGatewayToken = ""
          }
          EOF
      - name: Resolve Swift Packages
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project CameraAccess.xcodeproj
      - name: Archive App
        working-directory: samples/CameraAccess
        run: |
          xcodebuild \
            -project CameraAccess.xcodeproj \
            -scheme CameraAccess \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/CameraAccess.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: CameraAccess
          path: |
            samples/CameraAccess/build
            samples/CameraAccess/**/*.xcarchive
          if-no-files-found: warn
